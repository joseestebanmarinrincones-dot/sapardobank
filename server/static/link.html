<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D2F">
<title>Sapardobank · Vincular banco</title>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<style>
  :root {
    --ink: #14241D;
    --muted: #6C7A72;
    --paper: #F4F1E9;
    --card: #FFFFFF;
    --green: #0F6B54;
    --deep: #0B3D2F;
    --mint: #DDEFE5;
    --gold: #E9B65A;
    --line: #E8E2D6;
    --danger: #D9654C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 100% -10%, rgba(15,107,84,.16), transparent 60%),
      radial-gradient(800px 500px at -10% 110%, rgba(233,182,90,.18), transparent 60%),
      var(--paper);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border-radius: 28px;
    padding: 28px;
    box-shadow: 0 24px 60px rgba(11, 43, 34, .13);
    border: 1px solid rgba(232, 226, 214, .9);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    letter-spacing: .18em;
    font-size: 11px;
    color: var(--green);
    margin-bottom: 26px;
  }
  .mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: var(--deep);
    color: #F7F4EB;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    letter-spacing: 0;
  }
  .badge {
    display: inline-block;
    background: var(--mint);
    color: var(--green);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .12em;
    padding: 6px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .badge.error { background: #FBE9E3; color: var(--danger); }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 34px;
    line-height: 1.08;
    margin: 0 0 10px;
    letter-spacing: -.02em;
  }
  p { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 14px; }
  code {
    background: #F7F3EA;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--ink);
    word-break: break-all;
  }
  button {
    width: 100%;
    border: 0;
    border-radius: 16px;
    padding: 16px;
    background: var(--green);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin: 8px 0 14px;
    transition: transform .12s ease, background .12s ease;
  }
  button:hover { background: #0C5945; }
  button:active { transform: scale(.99); }
  button:disabled { opacity: .55; cursor: wait; }
  .muted { font-size: 12.5px; color: var(--muted); }
  .security {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 7px;
    align-items: center;
  }
  .security::before { content: "🔒"; }
  strong { color: var(--ink); }
  a { color: var(--green); font-weight: 700; }
</style>
</head>
<body>
  {{CONTENT}}
</body>
</html>
